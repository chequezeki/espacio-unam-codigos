name: Reportar un problema
description: Código que no funciona, mal clasificado, o un dato personal que debe retirarse.
title: "Reporte: "
labels: ["reporte"]
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de reporte
      options:
        - El código no funciona
        - Está en la sección o carrera equivocada
        - Contiene un dato personal que quiero retirar
        - Otro
    validations:
      required: true
  - type: input
    id: codigo
    attributes:
      label: Código o archivo afectado
      placeholder: "ABC234 o codigos/fes.md"
  - type: textarea
    id: detalle
    attributes:
      label: Detalle
      description: Si es un dato personal, no lo repitas aquí; basta con indicar dónde está.
    validations:
      required: true
